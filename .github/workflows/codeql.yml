name: 'CodeQL'

# Advanced setup replacing GitHub's default CodeQL setup, so scans can skip
# changes that only touch release-please's version and changelog files.
# Languages, queries, and result categories match the default setup, so
# existing alerts carry over.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - '.release-please-manifest.json'
      - 'package.json'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - '.release-please-manifest.json'
      - 'package.json'
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - name: Checkout 🛰️
        uses: actions/checkout@v7

      - name: Initialize CodeQL 🔍
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze 🛡️
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
