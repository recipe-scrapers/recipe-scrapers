name: 'CodSpeed'

# Parse-speed benchmarks (bench/**/*.bench.ts). CodSpeed counts CPU
# instructions instead of timing them, so results are stable across runners;
# runs on main are the baseline each PR is compared against.
#
# Runs only when a file that can change parse speed changes, so docs,
# formatting, and release-please PRs skip it. Dependency updates still run
# because they change bun.lock. A main commit without a run is fine:
# CodSpeed compares against the latest earlier run instead.

on:
  push:
    branches: [main]
    paths: &benchmark-paths
      - 'src/**'
      - 'bench/**'
      - 'test-data/**'
      - 'bun.lock'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - '.github/workflows/codspeed.yml'
  pull_request:
    branches: [main]
    paths: *benchmark-paths
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC authentication with CodSpeed

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    # Vitest runs bench files one at a time, and one page takes minutes under
    # simulation, so each shard runs one bench file. CodSpeed merges the shards.
    strategy:
      matrix:
        shard: [1/5, 2/5, 3/5, 4/5, 5/5]
    steps:
      - name: Checkout 🛰️
        uses: actions/checkout@v7

      - name: Install bun 🍔
        uses: oven-sh/setup-bun@v2

      # Benchmarks run on Node: CodSpeed instruments Node, not Bun.
      - name: Install node 🟩
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies 📦
        run: bun install

      - name: Run benchmarks ⏱️
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          # Call vitest directly so the instrumented process is Node, not a
          # package-manager wrapper.
          run: node_modules/.bin/vitest bench --run --shard=${{ matrix.shard }}
